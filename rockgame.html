<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 벽돌깨기 챔피언</title>
    <style>
        body {
            background-color: #0b0b16;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            margin-bottom: 10px;
            font-size: 24px;
            letter-spacing: 2px;
        }
        #gameContainer {
            border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff;
            background-color: #05050a;
            position: relative;
        }
        canvas {
            display: block;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 480px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .score-box { text-align: center; }
        .label { color: #ffaa00; }
        .value { color: #fff; text-shadow: 0 0 5px #fff; }
    </style>
</head>
<body>

    <h1>BRICK BREAKER CHAMPION</h1>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="320"></canvas>
    </div>

    <div class="scoreboard">
        <div class="score-box"><span class="label">SCORE:</span><br><span id="score" class="value">0</span></div>
        <div class="score-box"><span class="label">HIGH SCORE:</span><br><span class="value">48,900</span></div>
        <div class="score-box"><span class="label">LIVES:</span><br><span id="lives" class="value">❤️❤️❤️</span></div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 공 설정
        let ballRadius = 6;
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 3;
        let dy = -3;

        // 패들 설정 (바)
        const paddleHeight = 10;
        const paddleWidth = 75;
        let paddleX = (canvas.width - paddleWidth) / 2;
        let rightPressed = false;
        let leftPressed = false;

        // 벽돌 설정
        const brickRowCount = 5;
        const brickColumnCount = 7;
        const brickWidth = 57;
        const brickHeight = 15;
        const brickPadding = 5;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 25;

        // 벽돌 색상 (무지개 네온)
        const brickColors = ["#ff0055", "#ff9900", "#ffea00", "#00ff66", "#00ffff"];

        let bricks = [];
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1, color: brickColors[r] };
            }
        }

        let score = 0;
        let lives = 3;

        // 키보드 및 마우스 이벤트 listen
        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);
        document.addEventListener("mousemove", mouseMoveHandler, false);

        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        }

        function mouseMoveHandler(e) {
            const relativeX = e.clientX - canvas.getBoundingClientRect().left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }

        // 충돌 감지
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score += 100;
                            document.getElementById("score").innerText = score;
                            if (score === brickRowCount * brickColumnCount * 100) {
                                alert("축하합니다! 스테이지 클리어!");
                                document.location.reload();
                            }
                        }
                    }
                }
            }
        }

        // 공 그리기
        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ffffff";
            ctx.fill();
            ctx.closePath();
        }

        // 패들 그리기
        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight - 5, paddleWidth, paddleHeight);
            ctx.fillStyle = "#00f0ff";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#00f0ff";
            ctx.fill();
            ctx.closePath();
        }

        // 벽돌 그리기
        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.shadowBlur = 6;
                        ctx.shadowColor = bricks[c][r].color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        // 전체 화면 갱신
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 그림자 초기화용 기본 세팅
            ctx.shadowBlur = 0;

            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // 벽 충돌 (좌우)
            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }
            // 벽 충돌 (위)
            if (y + dy < ballRadius) {
                dy = -dy;
            } 
            // 바닥 충돌 처리
            else if (y + dy > canvas.height - ballRadius - 5) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    // 패들에 맞은 위치에 따라 튕기는 각도 조절
                    let collidePoint = x - (paddleX + paddleWidth / 2);
                    collidePoint = collidePoint / (paddleWidth / 2);
                    let angle = collidePoint * (Math.PI / 3);
                    
                    dx = 4 * Math.sin(angle);
                    dy = -4 * Math.cos(angle);
                } else {
                    lives--;
                    if (!lives) {
                        document.getElementById("lives").innerText = "❌ GAME OVER";
                        alert("게임 오버!");
                        document.location.reload();
                    } else {
                        document.getElementById("lives").innerText = "❤️".repeat(lives);
                        x = canvas.width / 2;
                        y = canvas.height - 30;
                        dx = 3;
                        dy = -3;
                        paddleX = (canvas.width - paddleWidth) / 2;
                    }
                }
            }

            // 패들 이동
            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += 5;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= 5;
            }

            x += dx;
            y += dy;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
